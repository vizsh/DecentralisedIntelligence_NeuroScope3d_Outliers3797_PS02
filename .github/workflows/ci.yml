name: CI

# Every push and PR runs the fast, deterministic checks: the backend's pure-function
# pytest suite, the judges' own pipeline test pack against the heuristic fallback model
# (the real MONAI checkpoint is too slow/heavy to download and run on every commit —
# see docs/IMPLEMENTATION_PLAN.md, which already flagged this as the intended split),
# and the frontend type check + build.
#
# Deliberately NOT run here, and why:
#   - run_judge_tests.py --model bundle (the real checkpoint): multi-GB download plus
#     real inference time per run. Run it locally before a release; see CLAUDE.md.
#   - run_assistant_guardrail_tests.py: needs a live local Ollama instance with
#     llama3.1:8b (4.9 GB) and nomic-embed-text pulled. Not something a hosted CI
#     runner can do cheaply or fast. Run it locally after touching
#     backend/neuroscope/assistant.py, assistant_corpus.py, or its SYSTEM_PROMPT —
#     see docs/ASSISTANT.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Pure-function pytest suite
        run: python -m pytest tests/ -q

      - name: Generate the synthetic judge test pack
        run: python make_testcase.py --out ./testdata

      - name: Judges' pipeline tests (heuristic model — fast, no checkpoint download)
        run: python run_judge_tests.py --data ./testdata --model heuristic

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Build
        run: npm run build
